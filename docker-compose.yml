services:
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:4200,http://keycloak:8080"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    volumes:
      - minio_data:/data
      - ./policies:/policies:ro
      - ./scripts:/scripts:ro
    command: server /data --console-address ":9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    volumes:
      - ./policies:/policies:ro
      - ./scripts:/scripts:ro
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_MINIO_CLIENT_ID=${KEYCLOAK_MINIO_CLIENT_ID}
      - KEYCLOAK_MINIO_SECRET=${KEYCLOAK_MINIO_SECRET}
    networks:
      - app-network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/scripts/setup-minio.sh"]
    restart: "no"

  postgres-task-db:
    image: postgres:15
    container_name: postgres-task-db
    environment:
      POSTGRES_USER: ${DB_TASK_USERNAME}
      POSTGRES_PASSWORD: ${DB_TASK_PASSWORD}
      POSTGRES_DB: taskdb
    volumes:
      - pgdata-task:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  postgres-file-db:
    image: postgres:15
    container_name: postgres-file-db
    environment:
      POSTGRES_USER: ${DB_FILE_USERNAME}
      POSTGRES_PASSWORD: ${DB_FILE_PASSWORD}
      POSTGRES_DB: filedb
    volumes:
      - pgdata-file:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-network

  taskserver:
    image: workfred/task-server:latest
    container_name: taskserver
    depends_on:
      - postgres-task-db
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_TASK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_TASK_CLIENT_SECRET}
      - DB_TASK_USERNAME=${DB_TASK_USERNAME}
      - DB_TASK_PASSWORD=${DB_TASK_PASSWORD}
      - DB_TASK_URL=jdbc:postgresql://postgres-task-db:5432/taskdb
      - DB_TASK_TYPE=postgresql
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_SCOPE=${KEYCLOAK_SCOPE}
    ports:
      - "8085:8085"
    networks:
      - app-network

  fileserver:
    image: workfred/file-server:latest
    container_name: fileserver
    depends_on:
      - postgres-file-db
      - minio
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_FILE_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_FILE_CLIENT_SECRET}
      - DB_FILE_USERNAME=${DB_FILE_USERNAME}
      - DB_FILE_PASSWORD=${DB_FILE_PASSWORD}
      - DB_FILE_URL=jdbc:postgresql://postgres-file-db:5432/filedb
      - DB_FILE_TYPE=postgresql
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_SCOPE=${KEYCLOAK_SCOPE}
      - TASK_API_URL=http://taskserver:8085/api
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    ports:
      - "8083:8083"
    networks:
      - app-network

  gateway:
    image: workfred/gateway:latest
    container_name: gateway
    depends_on:
      - fileserver
      - taskserver
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_GATEWAY_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_GATEWAY_CLIENT_SECRET}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_SCOPE=${KEYCLOAK_SCOPE}
      - TASK_API_URL=http://taskserver:8085/api
      - FILE_API_URL=http://fileserver:8083/api
    ports:
      - "8086:8086"
    networks:
      - app-network

  # Angular UI Application
  task-app-ui:
    image: workfred/task-app-ui:latest
    container_name: task-app-ui
    depends_on:
      - gateway
    ports:
      - "4400:4400"
    networks:
      - app-network

volumes:
  minio_data:
  pgdata-task:
  pgdata-file:

networks:
  app-network:
    driver: bridge
